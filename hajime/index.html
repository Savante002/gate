<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hajime's Kill List</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23eb2832' stroke-width='3'/%3E%3Cpath d='M16 1v8M16 23v8M1 16h8M23 16h8' stroke='%23eb2832' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Video fills the screen; after the punchline a "target dossier" panel slides over it. */
  :root {
    --bg: #050307;
    --panel: #0c0612;
    --line: #3a2448;
    --text: #efe8f5;
    --muted: #9c8aab;
    --red: #eb2832;
    --accent: #b03df9;
    --display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
  body { display: grid; place-items: center; overflow: hidden; font-family: var(--mono); }
  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 640 / 590));
    width: min(100vw, calc(100dvh * 640 / 590));
    aspect-ratio: 640 / 590;
    container-type: inline-size;
  }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--bg); }
  .dossier {
    position: absolute; inset: 4cqw;
    display: flex; flex-direction: column; gap: 2cqw;
    padding: 3.4cqw 4cqw;
    background: var(--panel);
    border: 0.35cqw solid var(--red);
    box-shadow: 0 0 6cqw rgba(235, 40, 50, 0.25), inset 0 0 0 0.2cqw rgba(176, 61, 249, 0.25);
    opacity: 0; transform: scale(0.96); pointer-events: none;
    transition: opacity 400ms ease, transform 400ms ease;
  }
  .dossier.open { opacity: 1; transform: none; pointer-events: auto; }
  .head { display: flex; justify-content: space-between; align-items: baseline; gap: 2cqw; flex-wrap: wrap; }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 400; letter-spacing: 0.04em;
    font-size: 7.4cqw; line-height: 1; text-wrap: balance;
  }
  h1 span { color: var(--red); }
  .classified { font-size: 2.1cqw; color: var(--red); letter-spacing: 0.25em; text-transform: uppercase; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6cqw; }
  .stat { border: 0.25cqw solid var(--line); padding: 1.6cqw 1cqw; text-align: center; }
  .stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 6cqw; line-height: 1.05;
            color: var(--red); font-variant-numeric: tabular-nums; }
  .stat small { font-size: 2cqw; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase; }
  .list { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none;
          border-top: 0.25cqw solid var(--line); scrollbar-color: var(--line) transparent; }
  .list li { display: grid; grid-template-columns: 4.4cqw 1fr auto; align-items: center; gap: 1.6cqw;
             padding: 0.8cqw 0.4cqw; border-bottom: 0.2cqw dashed var(--line); }
  .list img, .list .ph { width: 4.4cqw; height: 4.4cqw; border-radius: 0.6cqw; object-fit: cover;
                         filter: grayscale(1) contrast(1.1); background: var(--line); }
  .name { font-size: 2.9cqw; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
          text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 0.4cqw; }
  .when { font-size: 2cqw; color: var(--muted); text-align: right; white-space: nowrap; }
  .when em { display: inline; margin-right: 1.2cqw; font-style: normal; color: var(--red); letter-spacing: 0.12em; }
  .spared .name { text-decoration: none; color: var(--accent); }
  .spared img { filter: none; }
  .spared .when em { color: var(--accent); }
  .empty { padding: 5cqw 1cqw; text-align: center; color: var(--muted); font-size: 2.8cqw; line-height: 1.6; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 2cqw; flex-wrap: wrap;
          font-size: 2cqw; color: var(--muted); }
  button {
    font: 700 2.4cqw var(--mono); color: var(--text); background: transparent; letter-spacing: 0.1em;
    border: 0.25cqw solid var(--red); padding: 1.2cqw 2.4cqw; cursor: pointer; text-transform: uppercase;
  }
  button:hover, button:focus-visible { background: var(--red); outline: none; }
  @media (prefers-reduced-motion: reduce) { .dossier { transition: none; } }
</style>
</head>
<body>
<div class="stage">
  <video id="clip" muted autoplay playsinline preload="auto" poster="poster.jpg">
    <source src="hajime.webm" type="video/webm">
    <source src="hajime.mp4" type="video/mp4">
  </video>

  <section class="dossier" id="dossier" aria-live="polite">
    <div class="head">
      <h1>HAJIME'S <span>KILL LIST</span></h1>
      <div class="classified">Classified · Unfollowers</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="c-day">–</b><small>24 hours</small></div>
      <div class="stat"><b id="c-week">–</b><small>7 days</small></div>
      <div class="stat"><b id="c-month">–</b><small>30 days</small></div>
      <div class="stat"><b id="c-year">–</b><small>1 year</small></div>
    </div>
    <ul class="list" id="list"><li class="empty">Loading targets…</li></ul>
    <div class="foot">
      <span id="meta">Scanning…</span>
      <button type="button" id="replay">▶ Replay</button>
    </div>
  </section>
</div>

<script>
(() => {
  const SHOW_AT = 12.6;   // seconds into the clip: after "(the most brutal punishment on AniList)"
  const video = document.getElementById("clip");
  const dossier = document.getElementById("dossier");
  const $ = id => document.getElementById(id);

  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
    if (s < 86400) return Math.round(s / 3600) + " h ago";
    if (s < 86400 * 45) { const d = Math.round(s / 86400); return d + (d === 1 ? " day ago" : " days ago"); }
    return Math.round(s / 86400 / 30) + " months ago";
  }

  function render(data) {
    const events = (data.events || []).slice().reverse();          // newest first
    const kills = events.filter(e => !e.spared);
    const within = days => kills.filter(e => Date.now() - new Date(e.at) <= days * 86400000).length;
    $("c-day").textContent = within(1);
    $("c-week").textContent = within(7);
    $("c-month").textContent = within(30);
    $("c-year").textContent = within(365);

    const list = $("list");
    list.textContent = "";
    if (!events.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "No targets yet. Everyone is still following… for now.";
      list.append(li);
    }
    for (const e of events) {
      const li = document.createElement("li");
      if (e.spared) li.className = "spared";
      const pic = document.createElement(e.avatar ? "img" : "div");
      if (e.avatar) { pic.src = e.avatar; pic.alt = ""; pic.loading = "lazy"; } else pic.className = "ph";
      const name = document.createElement("a");
      name.className = "name";
      name.textContent = e.name;
      name.href = "https://anilist.co/user/" + encodeURIComponent(e.name);
      name.target = "_blank"; name.rel = "noopener";
      name.style.color = "inherit";
      const when = document.createElement("div");
      when.className = "when";
      const tag = document.createElement("em");
      tag.textContent = e.spared ? "SPARED" : "ELIMINATED";
      when.append(tag, document.createTextNode(ago(e.spared ? e.spared_at : e.at)));
      li.append(pic, name, when);
      list.append(li);
    }
    $("meta").textContent = data.updated
      ? `Last scan ${ago(data.updated)} · ${data.followers} followers still alive`
      : "First scan pending";
  }

  fetch("kill_list.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => (r.ok ? r.json() : { events: [] }))
    .catch(() => ({ events: [] }))
    .then(render);

  const open = () => dossier.classList.add("open");
  video.addEventListener("timeupdate", () => { if (video.currentTime >= SHOW_AT) open(); });
  video.addEventListener("ended", open);
  video.addEventListener("error", open, true);
  $("replay").addEventListener("click", () => {
    dossier.classList.remove("open");
    video.currentTime = 0;
    video.play().catch(() => {});
  });
  video.play().catch(() => {
    // autoplay blocked: tap anywhere to start
    document.body.addEventListener("click", () => video.play().catch(open), { once: true });
  });
})();
</script>
</body>
</html>
