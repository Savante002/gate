<style>
  /* One black screen, the prank video letterboxed to fit, and the live counter drawn on top. */
  :root {
    --bg: #000;
    --text: #fff;
    --outline: #000;
    --accent: #b03df9;      /* ThePhantasmAl purple */
    --accent-outline: #14001e;
    --meme: "Anton", Impact, "Arial Narrow Bold", "Helvetica Neue", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body { display: grid; place-items: center; overflow: hidden; }
  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 498 / 374));
    width: min(100vw, calc(100dvh * 498 / 374));
    aspect-ratio: 498 / 374;
    container-type: inline-size;
    cursor: pointer;
  }
  .stage video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block; object-fit: contain; background: var(--bg);
  }
  .counter {
    position: absolute; left: 0; right: 0; top: 81.3%;
    transform: translateY(-50%);
    display: flex; justify-content: center; align-items: center; gap: 2cqw;
    font-family: var(--meme); line-height: 1; white-space: nowrap;
    pointer-events: none; user-select: none;
  }
  .counter[hidden] { display: none !important; }
  .count {
    color: var(--text);
    font-size: 4.2vw; font-size: 6.02cqw;
    -webkit-text-stroke: 1.2cqw var(--outline);
    paint-order: stroke fill;
    font-variant-numeric: tabular-nums;
  }
  .plus {
    color: var(--accent);
    font-size: 3.1vw; font-size: 4.4cqw;
    -webkit-text-stroke: 0.9cqw var(--accent-outline);
    paint-order: stroke fill;
    visibility: hidden;
    transform: translateY(-0.4cqw);
  }
  .plus.on { visibility: visible; animation: pop 160ms ease-out; }
  @keyframes pop {
    from { transform: translateY(0.6cqw) scale(0.6); }
    to   { transform: translateY(-0.4cqw) scale(1); }
  }
</style>

<script>
(() => {
  // Live victim counter: one hit per visit on a free public counter (abacus.jasoncameron.dev).
  // To start over from zero, change KEY to a new name.
  const NAMESPACE = "thephantasmal-anilist";
  const KEY = "gate-prank-victims";
  const FALLBACK = 1337;        // shown only if the counter service can't be reached
  const T_SHOW = 14.80;         // seconds into the clip: PRANKED stamp has landed
  const T_PLUS = 16.30;         // the counter ticks up and "+1 (YOU)" pops

  let victims = null;           // total victims including this visit

  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 5000);
  fetch(`https://abacus.jasoncameron.dev/hit/${NAMESPACE}/${KEY}`, { signal: ctl.signal, cache: "no-store" })
    .then(r => (r.ok ? r.json() : null))
    .then(j => { if (j && Number.isFinite(j.value)) victims = j.value; })
    .catch(() => {})
    .finally(() => clearTimeout(timer));

  const fmt = n => Math.max(0, n).toLocaleString("en-US");
  const video = document.getElementById("clip");
  const counter = document.getElementById("counter");
  const count = document.getElementById("count");
  const plus = document.getElementById("plus");

  let shown = false, ticked = false, lastText = "";
  function frame() {
    const t = video.currentTime || 0;
    const wantShow = t >= T_SHOW;
    const wantTick = t >= T_PLUS;
    if (wantShow !== shown) { counter.hidden = !wantShow; shown = wantShow; }
    if (wantTick !== ticked) { plus.classList.toggle("on", wantTick); ticked = wantTick; }
    if (wantShow) {
      const total = victims ?? FALLBACK;
      const text = "VICTIMS SO FAR: " + fmt(wantTick ? total : total - 1);
      if (text !== lastText) { count.textContent = text; lastText = text; }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const start = () => video.play().catch(() => {});
  // If the browser blocks autoplay, the first tap anywhere starts it (the poster even shows a play button).
  document.getElementById("stage").addEventListener("click", start);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) start(); });

  start();
})();
</script>
